<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блок 1 — KIIP Easy</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/test-question.css?v=2">
</head>
<body class="theme-blue" id="bodyTheme">
    <div class="container">
        <!-- Прогресс-бар -->
        <div class="progress-bar">
            <div class="progress-bar-row">
                <span class="progress-block-chapters" id="blockChapters">1~4과</span>
            </div>
            <div class="progress-bar-row">
                <span class="progress-block-title" id="blockTitle">자기소개 학교 사무실</span>
                <span class="progress-stats">
                    <span class="progress-correct" id="progressCorrect">0</span>
                    <span class="progress-divider">🟢</span>
                    <span class="progress-wrong" id="progressWrong">0</span>
                    <span class="progress-divider">🔴</span>
                    <span class="progress-total">| <span id="progressTotal">100</span></span>
                </span>
            </div>
        </div>

        <!-- Контейнеры вопросов будут добавлены сюда через JavaScript -->
        <div id="questionsContainer"></div>

        <!-- Навигация (fixed внизу) -->
        <div class="test-nav-bottom">
            <a href="../index.html" class="nav-button-small nav-button-home">← Главная</a>
            <a href="#" class="nav-button-small nav-button-repeat" id="repeatButton">Пройти заново</a>
            <a href="#" class="nav-button-small nav-button-next" id="nextButton">Следующий тест →</a>
        </div>
    </div>

    <script src="../js/app.js?v=4"></script>
    <script>
        // ==================== ЗАГРУЗКА ДАННЫХ ИЗ JSON ====================
        let questions = [];
        let totalQuestions = 0;
        let correctCount = 0;
        let wrongCount = 0;
        const answeredQuestions = {};

        // Получаем номер блока из URL
        let currentBlock = 1;
        const blockThemes = {
            1: 'theme-blue',
            2: 'theme-yellow',
            3: 'theme-green',
            4: 'theme-pink'
        };
        const blockTitles = {
            1: 'Блок 1 (1-4과)',
            2: 'Блок 2 (5-9과)',
            3: 'Блок 3 (10-14과)',
            4: 'Блок 4 (15-18과)'
        };
        const blockInfo = {
            1: { title: '자기소개 학교 사무실', chapters: '1~4과', subtitle: 'Знакомство, школа, офис' },
            2: { title: '시간 음식 쇼핑', chapters: '5~9과', subtitle: 'Время, еда, покупки' },
            3: { title: '가족 교통 약국', chapters: '10~14과', subtitle: 'Семья, транспорт, аптека' },
            4: { title: '날씨 병원 계획', chapters: '15~18과', subtitle: 'Погода, больница, планы' }
        };

        // Количество вопросов по блокам (для сквозной нумерации)
        const blockSizes = {
            1: 100,
            2: 125,
            3: 125,
            4: 100
        };

        // Вычисляем смещение для сквозной нумерации
        function getGlobalQuestionNum(localNum) {
            let offset = 0;
            for (let i = 1; i < currentBlock; i++) {
                offset += blockSizes[i];
            }
            return offset + localNum;
        }

        // Загрузка JSON
        async function loadQuestions() {
            // Получаем номер блока из URL
            const urlParams = new URLSearchParams(window.location.search);
            currentBlock = parseInt(urlParams.get('block')) || 1;

            // Устанавливаем тему
            const theme = blockThemes[currentBlock] || 'theme-blue';
            document.getElementById('bodyTheme').className = theme;

            // Обновляем заголовок
            document.title = blockTitles[currentBlock] + ' — KIIP Easy';

            // Обновляем информацию о блоке в прогресс-баре
            const info = blockInfo[currentBlock];
            document.getElementById('blockTitle').textContent = info.title;
            document.getElementById('blockChapters').textContent = info.chapters;

            try {
                const response = await fetch(`../data/block${currentBlock}.json`);
                const data = await response.json();
                questions = data.questions;
                totalQuestions = questions.length;
                document.getElementById('progressTotal').textContent = totalQuestions;

                // Обновляем кнопку Следующий тест
                const nextButton = document.getElementById('nextButton');
                const nextBlock = currentBlock + 1;
                if (nextBlock > 4) {
                    nextButton.style.display = 'none';
                } else {
                    // TODO: здесь будет проверка подписки
                    nextButton.href = `test-question.html?block=${nextBlock}`;
                }

                // Добавляем обработчик для Пройти заново
                document.getElementById('repeatButton').onclick = function(e) {
                    e.preventDefault();
                    resetProgress();
                };

                renderAllQuestions();
            } catch (error) {
                console.error('Ошибка загрузки вопросов:', error);
                document.getElementById('questionsContainer').innerHTML = '<p style="padding: 20px; text-align: center;">Ошибка загрузки вопросов</p>';
            }
        }

        // ==================== РЕНДЕР ВСЕХ ВОПРОСОВ ====================
        function renderAllQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const num = index + 1;

                // Создаем HTML контейнера
                const questionHTML = createQuestionHTML(q, num);
                container.insertAdjacentHTML('beforeend', questionHTML);
            });

            // Добавляем кнопку Результат в конце
            const resultButtonHTML = `
                <div class="result-nav">
                    <a href="results.html?block=${currentBlock}" class="result-button">Результат</a>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', resultButtonHTML);
        }

        // Создание HTML для одного вопроса
        function createQuestionHTML(q, num) {
            const globalNum = getGlobalQuestionNum(num);  // Сквозной номер
            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                optionsHTML += `
                    <label class="option" onclick="selectOption(${num}, ${i + 1})">
                        <span class="option-radio"></span>
                        <span class="option-text">${opt}</span>
                    </label>
                `;
            });

            return `
                <div class="question-container" id="questionContainer${num}" data-question-id="${globalNum}">
                    <div class="status-bar status-pending" id="statusBar${num}"></div>

                    <div class="question-content">
                        <div class="question-number">${globalNum}</div>
                        <div class="question-text">${q.question}</div>
                    </div>

                    <div class="options" id="options${num}">
                        ${optionsHTML}
                    </div>

                    <button class="explanation-button ${blockThemes[currentBlock] || 'theme-blue'}" id="explanationButton${num}" onclick="showExplanation(${num})" style="display: none;">
                        Разбор ответа
                    </button>

                    <div class="explanation-sheet" id="explanationSheet${num}">
                        <div class="explanation-header">
                            <span class="explanation-title">Разбор ответа</span>
                            <span class="explanation-close" onclick="hideExplanation(${num})">×</span>
                        </div>
                        <div class="explanation-content">
                            ${q.explanation}
                        </div>
                        <div class="explanation-footer">
                            <span class="explanation-number">#${globalNum}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==================== ЛОГИКА ====================

        // Сохранение прогресса в localStorage
        function saveProgress() {
            const progress = JSON.parse(localStorage.getItem('kiip_progress') || '{}');

            progress[`block${currentBlock}`] = {
                correct: Object.keys(answeredQuestions).filter(num => {
                    const q = questions[num - 1];
                    return q && answeredQuestions[num] && q.correctAnswer === progress[`block${currentBlock}`]?.answers?.[num];
                }).map(Number),
                wrong: [],
                answered: Object.keys(answeredQuestions).map(Number),
                total: totalQuestions,
                completed: Object.keys(answeredQuestions).length === totalQuestions
            };

            // Пересчитываем correct и wrong правильно
            const correct = [];
            const wrong = [];
            const answers = {};

            Object.keys(answeredQuestions).forEach(num => {
                const q = questions[num - 1];
                if (q) {
                    answers[num] = q.correctAnswer;
                    if (q.userCorrect) {
                        correct.push(parseInt(num));
                    } else {
                        wrong.push(parseInt(num));
                    }
                }
            });

            progress[`block${currentBlock}`] = {
                correct: correct,
                wrong: wrong,
                answered: Object.keys(answeredQuestions).map(Number),
                answers: answers,
                total: totalQuestions,
                completed: Object.keys(answeredQuestions).length === totalQuestions
            };

            localStorage.setItem('kiip_progress', JSON.stringify(progress));
        }

        // Обновление прогресс-бара
        function updateProgress() {
            document.getElementById('progressCorrect').textContent = correctCount;
            document.getElementById('progressWrong').textContent = wrongCount;
            saveProgress();
        }

        // Выбор варианта
        function selectOption(questionNum, optionNumber) {
            if (answeredQuestions[questionNum]) return;

            answeredQuestions[questionNum] = true;
            const question = questions[questionNum - 1];
            const isCorrect = optionNumber === question.correctAnswer;

            // Сохраняем результат ответа в объекте вопроса
            question.userCorrect = isCorrect;

            const optionsContainer = document.getElementById(`options${questionNum}`);
            optionsContainer.querySelectorAll('.option').forEach(opt => {
                opt.classList.add('option-disabled');
                opt.style.pointerEvents = 'none';
            });

            event.currentTarget.classList.add('option-selected');

            const statusBar = document.getElementById(`statusBar${questionNum}`);
            statusBar.classList.remove('status-pending');

            if (isCorrect) {
                statusBar.classList.add('status-correct');
                correctCount++;
            } else {
                statusBar.classList.add('status-wrong');
                wrongCount++;
            }

            updateProgress();
            document.getElementById(`explanationButton${questionNum}`).style.display = 'block';
        }

        // Показать разбор
        function showExplanation(questionNum) {
            const sheet = document.getElementById(`explanationSheet${questionNum}`);
            const container = document.getElementById(`questionContainer${questionNum}`);

            sheet.classList.add('explanation-visible');

            const progressBar = document.querySelector('.progress-bar');
            const offset = progressBar.offsetHeight;
            const containerRect = container.getBoundingClientRect();
            const targetPosition = window.pageYOffset + containerRect.top - offset;

            window.scrollTo({
                top: Math.max(0, targetPosition),
                behavior: 'smooth'
            });
        }

        // Скрыть разбор
        function hideExplanation(questionNum) {
            document.getElementById(`explanationSheet${questionNum}`).classList.remove('explanation-visible');
        }

        // Сброс прогресса и перезагрузка страницы
        function resetProgress() {
            const progress = JSON.parse(localStorage.getItem('kiip_progress') || '{}');
            delete progress[`block${currentBlock}`];
            localStorage.setItem('kiip_progress', JSON.stringify(progress));
            window.location.reload();
        }

        // Скролл к якорю
        function scrollToAnchor() {
            const hash = window.location.hash;
            if (hash) {
                const target = document.querySelector(hash);
                if (target) {
                    target.scrollIntoView({ behavior: 'auto', block: 'start' });
                }
            }
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', async function() {
            await loadQuestions();
            // Ждем рендеринга DOM
            setTimeout(scrollToAnchor, 100);
        });
    </script>
</body>
</html>
