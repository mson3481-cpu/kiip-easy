<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата — KIIP Easy</title>
    <link rel="stylesheet" href="../css/payment.css">
</head>
<body>
    <div class="payment-container">
        <!-- Иконка замка -->
        <div class="lock-icon">🔒</div>

        <!-- Заголовок -->
        <h1 class="payment-title">Доступ ограничен</h1>

        <!-- Цена -->
        <div class="price-block">
            <span class="price-amount">9,900₩</span>
            <span class="price-period">на 90 дней</span>
        </div>

        <!-- Описание -->
        <p class="payment-description">
            Для получения доступа к полной версии (Главы 5-18) свяжитесь с нами
        </p>

        <!-- Кнопки мессенджеров -->
        <div class="messenger-buttons">
            <button class="messenger-btn whatsapp-btn" onclick="openWhatsApp()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
                Написать и получить реквизиты
            </button>
            <button class="messenger-btn telegram-btn" onclick="openTelegram()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                </svg>
                Написать и получить реквизиты
            </button>
        </div>

        <!-- Разделитель -->
        <div class="divider"></div>

        <!-- Ссылка на активацию (раскрывает блок) -->
        <button class="activation-toggle" onclick="toggleActivation()">
            Уже оплатили? <span class="toggle-arrow">▼</span>
        </button>

        <!-- Блок активации (скрыт по умолчанию) -->
        <div id="activation-section" class="activation-section hidden">
            <p class="activation-title">Ваш ID:</p>
            <div class="device-id-block">
                <span id="device-id" class="device-id-text">загрузка...</span>
                <button class="copy-btn" onclick="copyDeviceID()" title="Скопировать">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
            </div>
            <p id="copy-feedback" class="copy-feedback">Скопировано!</p>

            <p class="activation-instruction">
                Отправьте его нам в чат, затем введите полученный ключ:
            </p>

            <div class="key-input-block">
                <input
                    type="text"
                    id="activation-key"
                    class="key-input"
                    placeholder="Введите ключ активации"
                    maxlength="20"
                >
                <button class="activate-btn" onclick="activateKey()">Активировать</button>
            </div>
            <p id="activation-feedback" class="activation-feedback"></p>
        </div>

        <!-- Кнопка назад -->
        <button class="back-btn" onclick="goBack()">← На главную</button>
    </div>

    <script>
        // ========== DeviceID ==========

        function getDeviceID() {
            let deviceID = localStorage.getItem('kiip_device_id');
            if (!deviceID) {
                const uuid = crypto.randomUUID();
                deviceID = 'KIIP-' + uuid;
                localStorage.setItem('kiip_device_id', deviceID);
            }
            return deviceID;
        }

        // Показываем DeviceID при загрузке (скрытый блок)
        document.getElementById('device-id').textContent = getDeviceID();

        // ========== Переключение блока активации ==========

        function toggleActivation() {
            const section = document.getElementById('activation-section');
            const arrow = document.querySelector('.toggle-arrow');
            section.classList.toggle('hidden');
            arrow.textContent = section.classList.contains('hidden') ? '▼' : '▲';
        }

        // ========== Копирование DeviceID ==========

        function copyDeviceID() {
            const deviceID = getDeviceID();
            navigator.clipboard.writeText(deviceID).then(() => {
                const feedback = document.getElementById('copy-feedback');
                feedback.style.display = 'block';
                setTimeout(() => {
                    feedback.style.display = 'none';
                }, 2000);
            });
        }

        // ========== Мессенджеры ==========

        function getMessage() {
            return 'Здравствуйте! Хочу получить доступ к KIIP Easy (Главы 5-18). Отправьте, пожалуйста, реквизиты для оплаты.';
        }

        function openWhatsApp() {
            const message = getMessage();
            navigator.clipboard.writeText(message).then(() => {
                alert('Текст скопирован! Теперь вставьте его в WhatsApp (Ctrl+V) и отправьте.');
                window.open('https://wa.me/', '_blank');
            });
        }

        function openTelegram() {
            const message = getMessage();
            navigator.clipboard.writeText(message).then(() => {
                alert('Текст скопирован! Теперь вставьте его в Telegram (Ctrl+V) и отправьте.');
                window.open('https://t.me/', '_blank');
            });
        }

        // ========== Активация ключа ==========

        function activateKey() {
            const input = document.getElementById('activation-key');
            const key = input.value.trim().toUpperCase();
            const feedback = document.getElementById('activation-feedback');
            const deviceID = getDeviceID();

            if (!key) {
                feedback.textContent = 'Введите ключ';
                feedback.className = 'activation-feedback error';
                return;
            }

            // TODO: Реальная проверка ключа
            // Для теста: ключ содержит "TEST" открывает доступ
            if (key.includes('TEST')) {
                localStorage.setItem('kiip_key', key);
                feedback.textContent = '✅ Ключ активирован! Доступ открыт.';
                feedback.className = 'activation-feedback success';
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1500);
            } else {
                feedback.textContent = '❌ Неверный ключ. Обратитесь в поддержку.';
                feedback.className = 'activation-feedback error';
            }
        }

        // ========== Навигация ==========

        function goBack() {
            window.location.href = '../index.html';
        }

        // Активация по Enter
        document.getElementById('activation-key').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') activateKey();
        });
    </script>
</body>
</html>
