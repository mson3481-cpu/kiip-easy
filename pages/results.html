<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты — KIIP Easy</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/results.css?v=4">
</head>
<body>
    <div class="container">
        <header class="results-header">
            <h1 id="blockTitle">Результаты</h1>
            <p id="blockSubtitle" class="block-subtitle"></p>
        </header>

        <!-- Прогресс-бар -->
        <div class="result-progress-bar" id="progressSection">
            <div class="progress-stats">
                <span class="stat-correct" id="correctCount">0</span>
                <span class="stat-divider">🟢</span>
                <span class="stat-wrong" id="wrongCount">0</span>
                <span class="stat-divider">🔴</span>
                <span class="stat-total">| <span id="totalCount">0</span></span>
            </div>
        </div>

        <!-- Сообщение если тест не закончен -->
        <div class="not-completed" id="notCompleted" style="display: none;">
            <p>Вы не закончили тест.</p>
            <p>Пройдите все вопросы чтобы увидеть результаты.</p>
            <div class="not-completed-numbers" id="notCompletedNumbers"></div>
        </div>

        <!-- Список ошибок -->
        <div class="errors-list" id="errorsList"></div>
    </div>

    <script>
        // Получаем номер блока из URL
        const urlParams = new URLSearchParams(window.location.search);
        const currentBlock = parseInt(urlParams.get('block')) || 1;

        const blockInfo = {
            1: { title: 'Блок 1 (1-4과)', subtitle: '자기소개 학교 사무실 — Знакомство, школа, офис' },
            2: { title: 'Блок 2 (5-9과)', subtitle: '시간 음식 쇼핑 — Время, еда, покупки' },
            3: { title: 'Блок 3 (10-14과)', subtitle: '가족 교통 약국 — Семья, транспорт, аптека' },
            4: { title: 'Блок 4 (15-18과)', subtitle: '날씨 병원 계획 — Погода, больница, планы' }
        };

        // Количество вопросов по блокам (для сквозной нумерации)
        const blockSizes = {
            1: 100,
            2: 125,
            3: 125,
            4: 100
        };

        // Вычисляем сквозной номер вопроса
        function getGlobalQuestionNum(localNum) {
            let offset = 0;
            for (let i = 1; i < currentBlock; i++) {
                offset += blockSizes[i];
            }
            return offset + localNum;
        }

        // Устанавливаем заголовок
        document.getElementById('blockTitle').textContent = blockInfo[currentBlock].title;
        document.getElementById('blockSubtitle').textContent = blockInfo[currentBlock].subtitle;

        // Загружаем прогресс из localStorage
        function loadResults() {
            const progress = JSON.parse(localStorage.getItem('kiip_progress') || '{}');
            const blockProgress = progress[`block${currentBlock}`];

            if (!blockProgress) {
                // Нет данных
                showNotCompleted();
                return;
            }

            // Показываем прогресс
            document.getElementById('correctCount').textContent = blockProgress.correct?.length || 0;
            document.getElementById('wrongCount').textContent = blockProgress.wrong?.length || 0;
            document.getElementById('totalCount').textContent = blockProgress.total || 0;

            if (!blockProgress.completed) {
                // Тест не закончен
                showNotCompleted();
                return;
            }

            // Показываем ошибки
            showErrors(blockProgress);
        }

        function showNotCompleted() {
            document.getElementById('notCompleted').style.display = 'block';
            document.getElementById('errorsList').innerHTML = '';

            // Показываем номера непройденных вопросов
            const progress = JSON.parse(localStorage.getItem('kiip_progress') || '{}');
            const blockProgress = progress[`block${currentBlock}`];
            const answered = blockProgress?.answered || [];
            const total = blockProgress?.total || 0;

            // Находим непройденные вопросы (сохраняем локальные номера)
            const notAnswered = [];
            for (let i = 1; i <= total; i++) {
                if (!answered.includes(i)) {
                    notAnswered.push(i);  // Локальный номер
                }
            }

            // Отображаем номера в кружках
            const numbersContainer = document.getElementById('notCompletedNumbers');
            if (notAnswered.length > 0) {
                numbersContainer.innerHTML = notAnswered.map(localNum => {
                    const globalNum = getGlobalQuestionNum(localNum);
                    return `<a href="test-question.html?block=${currentBlock}#questionContainer${localNum}" class="question-number-circle">${globalNum}</a>`;
                }).join('');
            } else {
                numbersContainer.innerHTML = '';
            }
        }

        function showErrors(blockProgress) {
            const errorsList = document.getElementById('errorsList');
            const wrongQuestions = blockProgress.wrong || [];

            if (wrongQuestions.length === 0) {
                // Нет ошибок
                errorsList.innerHTML = '<div class="no-errors"><p>🎉 Поздравляю! Нет ошибок!</p></div>';
                return;
            }

            // Загружаем вопросы из JSON
            fetch(`../data/block${currentBlock}.json`)
                .then(response => response.json())
                .then(data => {
                    const questions = data.questions;
                    let html = '';

                    wrongQuestions.forEach(num => {
                        const q = questions[num - 1];
                        const globalNum = getGlobalQuestionNum(num);  // Сквозной номер
                        if (q) {
                            html += `
                                <div class="error-item">
                                    <span class="error-number">❌ Вопрос #${globalNum}</span>
                                    <p class="error-text">${q.question}</p>
                                    <a href="test-question.html?block=${currentBlock}" class="error-link">Перейти к вопросу →</a>
                                </div>
                            `;
                        }
                    });

                    errorsList.innerHTML = html;
                })
                .catch(error => {
                    console.error('Ошибка загрузки вопросов:', error);
                    errorsList.innerHTML = '<p>Ошибка загрузки вопросов</p>';
                });
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            loadResults();
        });
    </script>
</body>
</html>
